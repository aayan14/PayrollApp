name: Build, Test, and Deploy to Azure

on:
  push:
    branches:
      - main

jobs:
  build-and-deploy:
    runs-on: windows-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore dependencies
        run: dotnet restore PayrollApp.sln

      - name: Build
        run: dotnet build PayrollApp.sln --configuration Release --no-restore

      - name: Run tests
        run: dotnet test PayrollApp.sln --configuration Release --no-build --verbosity normal

      - name: Publish
        run: dotnet publish PayrollApp/PayrollApp.csproj --configuration Release --output ./publish

      - name: Deploy to Azure Web App
        uses: azure/webapps-deploy@v3
        with:
          app-name: 'payroll-app'
          publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE }}
          package: ./publish
