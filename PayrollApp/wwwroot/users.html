<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>User Management</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Inter', 'Segoe UI', sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            color: #333;
            padding: 40px 20px;
        }

        .container {
            max-width: 900px;
            margin: 0 auto;
        }

        .topbar {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            margin-bottom: 24px;
        }

        h1 {
            font-size: 28px;
            font-weight: 700;
            color: white;
        }

        .subtitle {
            color: rgba(255,255,255,0.8);
            font-size: 14px;
            margin-top: 4px;
        }

        .user-info {
            display: flex;
            align-items: center;
            gap: 10px;
            background: rgba(255,255,255,0.15);
            padding: 8px 14px;
            border-radius: 10px;
        }

            .user-info span {
                color: white;
                font-size: 13px;
            }

        .role-badge {
            background: rgba(255,255,255,0.25);
            padding: 3px 10px;
            border-radius: 99px;
            font-size: 11px;
            font-weight: 600;
        }

        .card {
            background: white;
            border-radius: 12px;
            padding: 24px;
            margin-bottom: 24px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.15);
        }

            .card h2 {
                font-size: 16px;
                font-weight: 600;
                margin-bottom: 16px;
                color: #1a1a2e;
            }

        .form-row {
            display: flex;
            gap: 12px;
            align-items: flex-end;
            flex-wrap: wrap;
        }

        .form-group {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        label {
            font-size: 13px;
            font-weight: 500;
            color: #555;
        }

        select, input {
            padding: 8px 12px;
            border: 1px solid #ddd;
            border-radius: 8px;
            font-size: 14px;
            outline: none;
        }

            select:focus, input:focus {
                border-color: #4f46e5;
            }

        button {
            padding: 9px 20px;
            border: none;
            border-radius: 8px;
            font-size: 14px;
            font-weight: 500;
            cursor: pointer;
        }

        .btn-primary {
            background: #4f46e5;
            color: white;
        }

            .btn-primary:hover {
                background: #4338ca;
            }

        .btn-secondary {
            background: #f1f5f9;
            color: #333;
        }

            .btn-secondary:hover {
                background: #e2e8f0;
            }

        .alert {
            padding: 12px 16px;
            border-radius: 8px;
            font-size: 14px;
            margin-bottom: 16px;
            display: none;
        }

        .alert-error {
            background: #fef2f2;
            color: #dc2626;
            border: 1px solid #fecaca;
        }

        .alert-success {
            background: #f0fdf4;
            color: #16a34a;
            border: 1px solid #bbf7d0;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            font-size: 14px;
        }

        thead tr {
            background: #f8fafc;
        }

        th {
            text-align: left;
            padding: 10px 14px;
            font-weight: 600;
            color: #555;
            border-bottom: 2px solid #e2e8f0;
            font-size: 13px;
        }

        td {
            padding: 10px 14px;
            border-bottom: 1px solid #f1f5f9;
        }

        .badge {
            display: inline-block;
            padding: 2px 8px;
            border-radius: 99px;
            font-size: 12px;
            font-weight: 500;
        }

        .badge-purple {
            background: #ede9fe;
            color: #6d28d9;
        }

        .badge-blue {
            background: #dbeafe;
            color: #1d4ed8;
        }

        .back-link {
            color: rgba(255,255,255,0.9);
            font-size: 13px;
            text-decoration: none;
            display: inline-block;
            margin-bottom: 16px;
        }

            .back-link:hover {
                text-decoration: underline;
            }
    </style>
</head>
<body>
    <div class="container">
        <a href="index.html" class="back-link">&larr; Back to Dashboard</a>
        <div class="topbar">
            <div>
                <h1>User Management</h1>
                <p class="subtitle">Create and manage HR team accounts</p>
            </div>
            <div class="user-info">
                <span id="user-name"></span>
                <span id="user-role" class="role-badge"></span>
                <button class="btn-secondary" onclick="logout()">Logout</button>
            </div>
        </div>

        <div class="card">
            <h2>Create New HR User</h2>
            <div id="create-alert" class="alert"></div>
            <div class="form-row">
                <div class="form-group">
                    <label for="new-username">Username</label>
                    <input type="text" id="new-username" style="width:140px" />
                </div>
                <div class="form-group">
                    <label for="new-password">Password</label>
                    <input type="password" id="new-password" style="width:140px" />
                </div>
                <div class="form-group">
                    <label for="new-fullname">Full Name</label>
                    <input type="text" id="new-fullname" style="width:180px" />
                </div>
                <div class="form-group">
                    <label for="new-role">Role</label>
                    <select id="new-role">
                        <option value="AssociateHR">Associate HR</option>
                        <option value="SuperAdmin">Super Admin</option>
                    </select>
                </div>
                <button class="btn-primary" onclick="createUser()">Create User</button>
            </div>
        </div>

        <div class="card">
            <h2>All Users</h2>
            <div id="users-body"></div>
        </div>
    </div>

    <script>
        const BASE = window.location.origin + '/payrollapp';
        const authToken = localStorage.getItem('authToken');
        const userRole = localStorage.getItem('userRole');
        const userFullName = localStorage.getItem('userFullName');

        if (!authToken) window.location.href = 'login.html';

        if (userRole !== 'SuperAdmin') {
            alert('Access denied. Only SuperAdmin can access this page.');
            window.location.href = 'index.html';
        }

        document.getElementById('user-name').textContent = userFullName || 'User';
        document.getElementById('user-role').textContent = userRole || '';

        function logout() {
            localStorage.clear();
            window.location.href = 'login.html';
        }

        function showAlert(id, type, message) {
            const el = document.getElementById(id);
            el.className = `alert alert-${type}`;
            el.textContent = message;
            el.style.display = 'block';
        }

        function renderUsers(users) {
            const rows = users.map(u => `
                <tr>
                    <td>${u.fullName}</td>
                    <td>${u.username}</td>
                    <td><span class="badge ${u.role === 'SuperAdmin' ? 'badge-purple' : 'badge-blue'}">${u.role}</span></td>
                    <td>${u.isActive ? 'Active' : 'Inactive'}</td>
                </tr>
            `).join('');

            document.getElementById('users-body').innerHTML = `
                <table>
                    <thead>
                        <tr><th>Full Name</th><th>Username</th><th>Role</th><th>Status</th></tr>
                    </thead>
                    <tbody>${rows}</tbody>
                </table>
            `;
        }

        async function loadUsers() {
            try {
                const res = await fetch(`${BASE}/users`, {
                    headers: { 'Authorization': `Bearer ${authToken}` }
                });
                if (!res.ok) throw new Error('Failed to load users.');
                const data = await res.json();
                renderUsers(data);
            } catch (err) {
                document.getElementById('users-body').innerHTML = `<p style="color:#dc2626">${err.message}</p>`;
            }
        }

        async function createUser() {
            const username = document.getElementById('new-username').value.trim();
            const password = document.getElementById('new-password').value;
            const fullName = document.getElementById('new-fullname').value.trim();
            const role = document.getElementById('new-role').value;

            if (!username || !password || !fullName) {
                showAlert('create-alert', 'error', 'Please fill in all fields.');
                return;
            }

            try {
                const res = await fetch(`${BASE}/users`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': `Bearer ${authToken}`
                    },
                    body: JSON.stringify({ username, password, fullName, role })
                });

                if (res.status === 400) {
                    const errData = await res.json();
                    let message = 'Invalid input.';
                    if (errData.errors) message = Object.values(errData.errors).flat().join(' ');
                    else if (errData.message) message = errData.message;
                    showAlert('create-alert', 'error', message);
                    return;
                }

                if (!res.ok) throw new Error('Failed to create user.');

                showAlert('create-alert', 'success', `User "${username}" created successfully.`);
                document.getElementById('new-username').value = '';
                document.getElementById('new-password').value = '';
                document.getElementById('new-fullname').value = '';
                loadUsers();

            } catch (err) {
                showAlert('create-alert', 'error', err.message);
            }
        }

        loadUsers();
    </script>
</body>
</html>
